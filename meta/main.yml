---
galaxy_info:
  role_name: emacs_build
  namespace: christiangeng
  author: Christian Geng
  description: >-
    Build GNU Emacs from source inside Docker and install it natively under
    the user's home, without root and without apt packages on the host.  For
    frozen distributions (Ubuntu LTS, Debian stable) whose packaged Emacs is
    too old; rolling releases (Arch, Debian unstable) do not need it.
  license: MIT
  min_ansible_version: "2.15"
  # Only what CI actually exercises, otherwise this is an untested claim.
  # The role derives emacs_base_image from host facts and has no
  # Ubuntu-specific logic, so noble and Debian bookworm are expected to
  # work - but nothing proves it. Add them back here as soon as the CI
  # matrix in .github/workflows/ci.yml covers them.
  platforms:
    - name: Ubuntu
      versions:
        - jammy
  galaxy_tags:
    - emacs
    - editor
    - docker
    - build
    - nativecomp
    - workstation

dependencies: []

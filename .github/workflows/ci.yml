---
name: CI

# Three tiers, because the cost difference is enormous (see issue #1):
#   lint       every push and PR, seconds, no Docker
#   toolchain  every push and PR, a few minutes per distribution: build the
#              container image from templates/Dockerfile.j2 and stop before
#              configure/make
#   full-build compile Emacs for real and upload the install tree, once per
#              distribution x version cell, in parallel.  Weekly, on a v*
#              tag, on manual dispatch, or on a push whose commit message
#              contains [full-build].  Never on an ordinary push.
#   release    on a v* tag only: collect every cell's tarball and attach
#              them to the release in one place (see issue #3).
#
# The runner and the container base image are always the same Ubuntu
# release (see issue #5).  The role compiles in the container but resolves
# libraries and runs the native-compile probe on the *host*, so a binary
# built against noble's glibc cannot be verified on a jammy runner.
"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Sundays 04:00 UTC.  Scheduled runs only ever fire on the default branch.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      emacs_versions:
        description: 'Emacs versions, JSON array (e.g. ["31.1"]). Blank builds them all.'
        required: false
        default: ""
      ubuntu_versions:
        description: 'Ubuntu LTS releases, JSON array (e.g. ["24.04"]). Blank builds them all.'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint -c .yamllint.yml .

      - name: ansible-lint
        run: ansible-lint -c .ansible-lint.yml

      # ansible.cfg sets roles_path=.., and the checkout directory is named
      # after the repository, so the role resolves as ansible-role-emacs-build.
      - name: Playbook syntax check
        run: ansible-playbook --syntax-check tests/test.yml

  toolchain:
    name: Toolchain image (Ubuntu ${{ matrix.ubuntu }})
    needs: lint
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 30
    strategy:
      # A new release breaking the apt build-dep list must not hide whether
      # the others still work.
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
        include:
          # Whichever gcc built this release's libgccjit0.  It has to travel
          # with the release: install the wrong libgccjit-N-dev and the image
          # builds fine, then check-emacs.sh fails on the host at the
          # native-compile probe because /usr/lib/gcc/.../N does not match.
          - ubuntu: "22.04"
            gcc: 12
          - ubuntu: "24.04"
            gcc: 14
          - ubuntu: "26.04"
            gcc: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      # Renders the Dockerfile, builds the image on its own buildx builder,
      # then tears both down again.  Exercises base image resolution and the
      # apt build-dep list without paying for the compile - which is exactly
      # what a new Ubuntu release breaks first.
      - name: Render Dockerfile and build the toolchain image
        run: |
          ansible-playbook tests/test.yml \
            --tags toolchain,cleanup \
            -e "emacs_base_image=ubuntu:${{ matrix.ubuntu }}" \
            -e "emacs_gcc_version=${{ matrix.gcc }}"

  full-build:
    name: Emacs ${{ matrix.emacs_version }} on Ubuntu ${{ matrix.ubuntu }}
    needs: lint
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || contains(github.event.head_commit.message, '[full-build]')
    # Same release as the base image, never mixed: the compile happens in
    # the container but bundle-missing-libs.sh and check-emacs.sh run here.
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 300
    strategy:
      # A regression in one cell must not cancel the rest.  jammy + 30.2 is
      # what is actually deployed; everything else is under test.
      fail-fast: false
      matrix:
        # The only place the built combinations are listed.  A dispatch can
        # narrow either axis; every other trigger builds the lot.
        ubuntu: ${{ fromJSON(inputs.ubuntu_versions || '["22.04", "24.04", "26.04"]') }}
        emacs_version: ${{ fromJSON(inputs.emacs_versions || '["30.2", "31.1"]') }}
        include:
          # Whichever gcc built this release's libgccjit0.  Keyed on ubuntu
          # so it is added to every cell of that release and cannot drift.
          - ubuntu: "22.04"
            gcc: 12
          - ubuntu: "24.04"
            gcc: 14
          - ubuntu: "26.04"
            gcc: 14
    env:
      EMACS_VERSION: ${{ matrix.emacs_version }}
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      # NOT the role default of ~/local/emacs-<ver>.  Emacs bakes the
      # configure --prefix into the binary (lisp dir, native-lisp dir,
      # rpath), so an install tree only works at the absolute path it was
      # configured for.  A tree built at /home/runner/... is useless to
      # anyone else, so CI builds at a neutral path that exists on every
      # box and the artifact is installable as-is.
      EMACS_PREFIX: /opt/emacs-${{ matrix.emacs_version }}
    steps:
      - uses: actions/checkout@v4

      # The role refuses to start below 4 GB free on Docker's disk and 6 GB
      # on the work disk; both are / on a hosted runner.  These trees are the
      # cheapest ~25 GB on the image and none of them are used here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # zstd for the artifact; gcc-N and binutils because check-emacs.sh does
      # a native-compile round trip on the *host*, which needs the gcc
      # support directory matching emacs_gcc_version.  N is the matrix's, so
      # the host directory and the container's libgccjit-N-dev agree.
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd "gcc-${{ matrix.gcc }}" binutils
          ls -d "/usr/lib/gcc/x86_64-linux-gnu/${{ matrix.gcc }}"
          python -m pip install --upgrade pip
          pip install ansible-core

      # make install runs in the container as the runner's uid, and the
      # role removes and re-creates the prefix, so the runner needs write
      # permission on /opt itself.  Not recursive: /opt/hostedtoolcache and
      # everything else under it keep their ownership.
      - name: Make /opt writable for the build user
        run: |
          sudo chown "$(id -un):$(id -gn)" /opt
          ls -ld /opt

      - name: Build Emacs ${{ env.EMACS_VERSION }} on Ubuntu ${{ env.UBUNTU_VERSION }}
        run: |
          ansible-playbook tests/test.yml \
            -e "emacs_base_image=ubuntu:${UBUNTU_VERSION}" \
            -e "emacs_version=${EMACS_VERSION}" \
            -e "emacs_prefix=${EMACS_PREFIX}" \
            -e "emacs_gcc_version=${{ matrix.gcc }}"

      # The role already verified the build; this asserts the same thing
      # through the versioned symlink a consumer would actually use.
      - name: Smoke-test the installed binary
        run: |
          "${EMACS_PREFIX}/bin/emacs" --version
          "$HOME/local/bin/emacs-${EMACS_VERSION}" --version

      - name: Package the install tree
        id: package
        run: |
          tarball="emacs-${EMACS_VERSION}-ubuntu-${UBUNTU_VERSION}-x86_64.tar.zst"
          tar --zstd -cf "$tarball" -C /opt "emacs-${EMACS_VERSION}"
          sha256sum "$tarball" > "$tarball.sha256"
          ls -lh "$tarball"
          cat "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-${{ env.EMACS_VERSION }}-ubuntu-${{ env.UBUNTU_VERSION }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 90
          # The tarball is already zstd; zipping it again buys nothing.
          compression-level: 0

      # The role deletes the work dir on success, so these only exist when
      # the compile failed - which is exactly when they are worth having.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per cell, not per version: two cells failing would otherwise
          # collide on the artifact name.
          name: build-logs-${{ env.EMACS_VERSION }}-ubuntu-${{ env.UBUNTU_VERSION }}
          path: |
            ~/local/build/emacs-build-${{ env.EMACS_VERSION }}/work/*.log
          if-no-files-found: warn
          retention-days: 14

  # A tag build gets a permanent download URL, so a control node can
  # install without ever building.
  #
  # Deliberately one job rather than a step inside the matrix: two matrix
  # jobs both running `gh release create` for the same tag race each other
  # - both look, both find nothing, both create, one loses.  Collecting the
  # artifacts and uploading once removes the race and lets full-build keep
  # a read-only token.
  release:
    name: Attach tarballs to the release
    needs: full-build
    # !cancelled() rather than success(): with fail-fast disabled, one cell
    # failing still leaves the others' tarballs worth publishing.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Collect every cell's tarball
        uses: actions/download-artifact@v4
        with:
          # Every distribution, not just jammy.  build-logs-* artifacts are
          # deliberately not matched.
          pattern: emacs-*-ubuntu-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out - it only downloads
          # artifacts - so gh has no git remote to infer the repository
          # from and every `gh release` call dies with "failed to run git:
          # not a git repository" before it reaches the API.  GH_REPO
          # replaces the inference; adding a checkout just to give gh a
          # remote would be a wasted clone.
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.zst dist/*.tar.zst.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no tarballs were built, nothing to publish" >&2
            exit 1
          fi
          ls -lh "${files[@]}"
          # Only "already exists" is tolerated.  Masking every failure here
          # turns a contents:write denial into a confusing upload error two
          # lines later.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists, uploading into it"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[] | "uploaded \(.name) \(.size) bytes"'
